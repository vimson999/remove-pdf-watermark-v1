{% extends "base.html" %}

{% block title %}PDF 工具箱 - PDF Smart Tool{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row g-4">
        <!-- Module 2: PDF Splitter Card -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-success text-white fw-bold py-3">
                    <i class="bi bi-scissors me-2"></i>智能拆分中心 (PDF Splitter)
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. 选择原始 PDF 文件</label>
                        <div class="p-4 border-2 border-dashed rounded text-center bg-light" id="splitDropZone" style="cursor:pointer;">
                            <i class="bi bi-file-earmark-pdf fs-2 text-success"></i>
                            <div class="small mt-2" id="selectedFileName">未选择文件</div>
                            <input type="file" id="splitFileInput" class="d-none" accept=".pdf">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">2. 配置拆分策略</label>
                        <div class="nav nav-tabs mb-3" id="splitTabs" role="tablist">
                            <button class="nav-link active small" id="equal-tab" data-bs-toggle="tab" data-bs-target="#equalSplit" type="button">等分拆分</button>
                            <button class="nav-link small" id="range-tab" data-bs-toggle="tab" data-bs-target="#rangeSplit" type="button">按范围拆分</button>
                        </div>
                        <div class="tab-content" id="splitTabContent">
                            <div class="tab-pane fade show active p-2" id="equalSplit">
                                <div class="input-group">
                                    <span class="input-group-text">每隔</span>
                                    <input type="number" class="form-control" id="splitStep" value="10" min="1">
                                    <span class="input-group-text">页拆分为一个文件</span>
                                </div>
                            </div>
                            <div class="tab-pane fade p-2" id="rangeSplit">
                                <input type="text" class="form-control" id="splitRanges" placeholder="例如: 1-5, 8-12, 15-20">
                                <div class="form-text mt-1">使用逗号分隔多个范围，页码从 1 开始。</div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-success btn-lg shadow-sm" id="executeSplit">执行物理分拆</button>
                    </div>

                    <!-- Split Results -->
                    <div id="splitStatus" class="mt-4" style="display: none;">
                        <div class="alert alert-info py-2 small d-flex align-items-center">
                            <div class="spinner-border spinner-border-sm me-2"></div>
                            正在进行底层结构切割...
                        </div>
                    </div>
                    <div id="splitDownloadArea" class="mt-3 d-flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Module 3: PDF Encryption Card (Coming Soon) -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-dark text-white fw-bold py-3">
                    <i class="bi bi-shield-lock-fill me-2"></i>安全加密 (Coming Soon)
                </div>
                <div class="card-body p-5 text-center text-muted">
                    <i class="bi bi-lock fs-1 mb-3 d-block opacity-25"></i>
                    <h5>模块 3：自主加密</h5>
                    <p class="small">支持 AES-256 权限管控，禁止打印、编辑、内容提取等。</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const dropZone = document.getElementById('splitDropZone');
    const fileInput = document.getElementById('splitFileInput');
    const fileNameDisplay = document.getElementById('selectedFileName');
    const splitBtn = document.getElementById('executeSplit');

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = () => {
        if (fileInput.files[0]) {
            fileNameDisplay.innerText = fileInput.files[0].name;
            fileNameDisplay.className = "small mt-2 fw-bold text-success";
        }
    };

    splitBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) {
            alert('请先选择 PDF 文件');
            return;
        }

        const activeTab = document.querySelector('#splitTabs .active').id;
        const formData = new FormData();
        formData.append('file', file);
        
        if (activeTab === 'equal-tab') {
            formData.append('mode', 'equal');
            formData.append('step', document.getElementById('splitStep').value);
        } else {
            formData.append('mode', 'range');
            formData.append('ranges', document.getElementById('splitRanges').value);
        }

        // UI State
        document.getElementById('splitStatus').style.display = 'block';
        document.getElementById('splitDownloadArea').innerHTML = '';
        splitBtn.disabled = true;

        try {
            const response = await fetch('/api/split', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('splitStatus').innerHTML = `
                    <div class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle-fill me-1"></i> 成功分拆为 ${data.count} 个文件
                    </div>
                `;
                data.files.forEach(filename => {
                    const btn = document.createElement('a');
                    btn.href = `/download/${filename}`;
                    btn.className = 'btn btn-outline-success btn-sm shadow-sm';
                    btn.innerHTML = `<i class="bi bi-download me-1"></i>${filename}`;
                    btn.target = '_blank';
                    document.getElementById('splitDownloadArea').appendChild(btn);
                });
            } else {
                alert('分拆失败: ' + data.error);
                document.getElementById('splitStatus').style.display = 'none';
            }
        } catch (e) {
            alert('网络请求失败');
        } finally {
            splitBtn.disabled = false;
        }
    };
</script>
{% endblock %}
