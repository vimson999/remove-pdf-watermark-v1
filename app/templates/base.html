<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF 智能安全与处理平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .nav-link.active { font-weight: bold; border-bottom: 2px solid var(--bs-primary); }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-light">
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary" href="/">
                <i class="bi bi-file-earmark-lock2-fill me-2"></i>PDF Smart Tool
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i>仪表盘
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'analyzer' %}active{% endif %}" href="/analyzer">
                            <i class="bi bi-search me-1"></i>深度解析
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'cleaner' %}active{% endif %}" href="/">
                            <i class="bi bi-droplet-fill me-1"></i>智能清洗
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'batch' %}active{% endif %}" href="/batch">
                            <i class="bi bi-folder-check me-1"></i>批量清洗
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'audio' %}active{% endif %}" href="/audio">
                            <i class="bi bi-soundwave me-1"></i>音频裁剪
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'toolbox' %}active{% endif %}" href="/toolbox">
                            <i class="bi bi-tools me-1"></i>工具箱
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="py-4 mt-5 text-center text-muted border-top bg-white">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 PDF 智能安全与处理平台 | 企业级内部工具</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
