<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理完成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; }
        .result-container { max-width: 600px; margin: 80px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-container text-center">
            <h1 class="display-4 text-success mb-4">🎉 处理完成!</h1>
            <p class="lead">您的文件已准备就绪。</p>
            
            <div class="list-group mb-4">
                {% for file in files %}
                <a href="/download/{{ file }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    {{ file }}
                    <span class="badge bg-primary rounded-pill">下载</span>
                </a>
                {% endfor %}
            </div>

            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </div>
</body>
</html>
