<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理进度 - PDF 智能去水印</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card main-card border-0 shadow-lg p-5">
                    <div class="text-center mb-5">
                        <div class="d-inline-block p-3 bg-primary bg-opacity-10 rounded-circle mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-cpu text-primary" viewBox="0 0 16 16">
                                <path d="M5 0a.5.5 0 0 1 .5.5V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2A2.5 2.5 0 0 1 14 4.5h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14a2.5 2.5 0 0 1-2.5 2.5v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14A2.5 2.5 0 0 1 2 11.5H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2A2.5 2.5 0 0 1 4.5 2V.5A.5.5 0 0 1 5 0zm-.5 3A1.5 1.5 0 0 0 3 4.5V11.5A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5V4.5A1.5 1.5 0 0 0 11.5 3h-7zM5 5h6v6H5V5z"/>
                            </svg>
                        </div>
                        <h2 class="fw-bold text-dark">智能清洗任务仪表盘</h2>
                        <p class="text-muted">已激活 M1 硬件加速并行处理引擎</p>
                    </div>

                    <div id="taskList" class="row">
                        {% for task in tasks %}
                        <div class="col-md-6 mb-4">
                            <div class="task-item p-4 border-0 rounded shadow-sm bg-white h-100" id="task-{{ task.task_id }}">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div class="text-truncate me-2">
                                        <h6 class="mb-1 fw-bold text-dark text-truncate" title="{{ task.filename }}">{{ task.filename }}</h6>
                                        <small class="text-muted" id="time-{{ task.task_id }}">已耗时: 0s</small>
                                    </div>
                                    <span class="badge bg-secondary px-3" id="badge-{{ task.task_id }}">排队中</span>
                                </div>
                                
                                <div class="progress mb-3" style="height: 8px; border-radius: 4px;">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                         id="progress-{{ task.task_id }}" 
                                         role="progressbar" 
                                         style="width: 0%"></div>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="small text-secondary" id="status-{{ task.task_id }}">
                                        <span class="spinner-grow spinner-grow-sm me-1"></span> 准备中...
                                    </div>
                                    <a href="{{ url_for('main.download', filename=task.output_filename) }}" 
                                       class="btn btn-sm btn-success px-3 d-none" 
                                       id="download-{{ task.task_id }}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-1" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                                        下载结果
                                    </a>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="text-center mt-5">
                        <hr class="mb-4 opacity-10">
                        <a href="/" class="btn btn-outline-primary px-4">处理更多文件</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tasks = {{ tasks|tojson }};
        const startTime = Date.now();
        
        function updateProgress() {
            tasks.forEach(task => {
                const taskId = task.task_id;
                const statusEl = document.getElementById(`status-${taskId}`);
                const progressEl = document.getElementById(`progress-${taskId}`);
                const badgeEl = document.getElementById(`badge-${taskId}`);
                const downloadBtn = document.getElementById(`download-${taskId}`);
                const timeEl = document.getElementById(`time-${taskId}`);

                if (badgeEl.innerText === '处理完成' || badgeEl.innerText === '处理失败') return;

                // Update elapsed time
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                timeEl.innerText = `已耗时: ${elapsed}s`;

                fetch(`/status/${taskId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.state === 'SUCCESS') {
                            badgeEl.innerText = '处理完成';
                            badgeEl.className = 'badge bg-success px-3';
                            progressEl.style.width = '100%';
                            progressEl.className = 'progress-bar bg-success';
                            statusEl.innerHTML = '<span class="text-success fw-bold">✨ 已清洗完成</span>';
                            downloadBtn.classList.remove('d-none');
                        } else if (data.state === 'PROGRESS') {
                            badgeEl.innerText = '执行中';
                            badgeEl.className = 'badge bg-warning text-dark px-3';
                            progressEl.style.width = `${data.percent}%`;
                            statusEl.innerText = data.status;
                        } else if (data.state === 'FAILURE') {
                            badgeEl.innerText = '处理失败';
                            badgeEl.className = 'badge bg-danger px-3';
                            statusEl.innerHTML = `<span class="text-danger">⚠️ ${data.status}</span>`;
                        }
                    });
            });
        }

        // Poll every 1.5 seconds
        const pollInterval = setInterval(() => {
            updateProgress();
            
            // If all done, clear interval
            const allDone = tasks.every(task => {
                const text = document.getElementById(`badge-${task.task_id}`).innerText;
                return text === '处理完成' || text === '处理失败';
            });
            if (allDone) clearInterval(pollInterval);
        }, 1500);
    </script>
</body>
</html>
