<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级 PDF 去水印平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="spinner-overlay" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <h4 class="mt-3 text-secondary">智能算法正在处理中，请稍候...</h4>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card main-card p-5">
                    <div class="text-center mb-5">
                        <h1 class="fw-bold text-primary">PDF 智能去水印</h1>
                        <p class="text-muted">基于 OpenCV 与自适应阈值算法的高精度文档清洗工具</p>
                    </div>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-warning fade show" role="alert">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
                        <div class="mb-4">
                            <div class="drop-zone" id="dropZone">
                                <div class="mb-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-cloud-arrow-up text-primary" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/>
                                        <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
                                    </svg>
                                </div>
                                <h5 class="text-dark">点击或拖拽文件到此处</h5>
                                <p class="small text-muted mb-0">支持 PDF 格式 | 单个文件最大 50MB</p>
                                <input type="file" name="files" id="fileInput" class="d-none" multiple accept=".pdf" required>
                            </div>
                            
                            <div id="fileListContainer" class="mt-4" style="display: none;">
                                <h6 class="text-start text-muted mb-2 ps-1">待处理文件清单:</h6>
                                <ul class="list-group shadow-sm" id="fileList">
                                    <!-- Dynamic items will be added here -->
                                </ul>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm" id="submitBtn" disabled>开始智能处理</button>
                        </div>
                    </form>
                </div>
                <div class="text-center mt-4 text-muted small">
                    &copy; 2026 Enterprise R&D Team. Internal Use Only.
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
